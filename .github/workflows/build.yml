name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Bump script tests
        run: python3 -I -m unittest discover -s .github/scripts -p 'test_*.py' -v

      # The unpack tests run the real 7-Zip (7zz, as in the image).
      - name: Install 7-Zip
        run: sudo apt-get update -q && sudo apt-get install -y -q 7zip && 7zz | head -2

      - name: Test
        run: dotnet test --configuration Release

  # Builds the image on every pull request so a broken Dockerfile shows up there;
  # pushes it only from main (tag dev) and from v* tags (version and latest).
  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      # The page looks fine without blazor.web.js but nothing on it works,
      # so check the image really serves it before pushing.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: scratcharr:smoke
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8188:8188 scratcharr:smoke
          for i in $(seq 1 30); do curl -fs http://localhost:8188/health && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8188/_framework/blazor.web.js
          curl -fsS http://localhost:8188/ | grep -q 'Scratcharr'
          curl -fsS http://localhost:8188/api/stats | grep -q '"toReview"'
          docker exec smoke test -f /config/scratcharr.db
          # 7-Zip runs and reports the version the Dockerfile pinned.
          docker exec smoke sh -c '7zz | grep "$SCRATCHARR_PIN_7ZIP"'
          docker logs smoke
          docker rm -f smoke

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
